version: "1.0"
repositories:
  # 示例1：只要单个文件
  wanvfx-tst:
    source: "https://github.com/wanvfx/zyqinglong"
    branch: "main"
    rules:
      - type: "include"
        patterns: ["tst.py"]
    target_dir: "."
  
  # 示例2：排除特定文件
  linbailo-clean:
    source: "https://github.com/linbailo/zyqinglong"
    branch: "main"
    rules:
      - type: "exclude"
        patterns: ["tsthb.py", "README.md", "readme.md", "bwcj.js"]
    target_dir: "."

  gitee-hlt1995:
    source: "https://gitee.com/hlt1995/qlScripts"
    branch: "main"  # Gitee 通常用 master
    rules:
      - type: "include"
        patterns: ["ChinaTelecomyyt.js", "Microsoft_Rewards_v2.1.py"]
    target_dir: "."  # 根目录

  # 新的 Gitee 仓库，排除指定文件
  gitee-liu-long068:
    source: "https://gitee.com/liu-long068/QL_TimingScript"
    branch: "master"
    rules:
      - type: "exclude"
        patterns: 
          - "WeChatPublicNumberPushInformation.py"
          - "移动云盘抓authorization.zip"
          - "README.md"
          - "sendNotify.py"
          - ".idea"
          - "anmusi.py"
          - "得物森林.py"
          # 如果中文文件名有问题，也可以尝试使用通配符
          - "*authorization*"
          - "*得物*"
          - "*森林*"
    target_dir: "."  # 根目录
    
  gitee-shitou158:
    source: "https://gitee.com/shitou158/qlScript"
    branch: "master"
    rules:
      - type: "exclude"
        patterns: 
          - "微信截图_20250929232706.png"
          - "info.txt"
          - "README.md"
          - "LICENSE"
          - ".gitignore"
    target_dir: "."  # 根目录
  
