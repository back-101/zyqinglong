version: "1.0"
repositories:
  # 示例1：只要单个文件
  wanvfx-tst:
    source: "https://github.com/wanvfx/zyqinglong"
    branch: "main"
    rules:
      - type: "include"
        patterns: ["tst.py"]
    target_dir: "."
  
  # 示例2：排除特定文件
  linbailo-clean:
    source: "https://github.com/linbailo/zyqinglong"
    branch: "main"
    rules:
      - type: "exclude"
        patterns: ["tsthb.py", "README.md", "readme.md", "bwcj.js"]
    target_dir: "."

  gitee-hlt1995:
    source: "https://gitee.com/hlt1995/qlScripts"
    branch: "main"  # Gitee 通常用 master
    rules:
      - type: "exclude"
        patterns: ["ChinaTelecomyyt.js", "Microsoft_Rewards_v2.1.py"]
    target_dir: "."  # 根目录
